<!doctype html>
<html lang="{{ site.data.metadata.language }}" data-color-mode="dark" data-light-theme="light" data-dark-theme="dark">

<head>
  <meta charset="utf-8">
  <title>{{ site.data.metadata.title }}</title>
  <meta name="description" content="{{ site.data.metadata.description }}">
  <meta name="title" content="{{ site.data.metadata.title }}">
  <meta name="image" content="{{ site.data.metadata.image }}">

  <!-- Basic Open Graph tags with dynamic content -->
  <meta property="og:title" content="{{ site.data.metadata.meta['og:title'] }}">
  <meta property="og:description" content="{{ site.data.metadata.meta['og:description'] }}">
  <meta property="og:image" content="{{ site.data.metadata.meta['og:image'] }}">
  <meta property="og:image:width" content="{{ site.data.metadata.meta['og:image:width'] }}">
  <meta property="og:image:height" content="{{ site.data.metadata.meta['og:image:height'] }}">
  <meta property="og:url" content="{{ site.url }}">
  <meta property="og:type" content="website">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v=2.3">

</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <main class="page desktop">
    <div class="desktop-top"><span>~ / indiscover.xyz</span></div>
    <div class="desktop-grid">
      <div class="desktop-left">
        <div class="desktop-window">
          <div class="window-bar"><span>~/home</span><span class="window-mark" aria-hidden="true">[x]</span></div>
          <div class="window-body">
            {% include profile.html %}
            {% include interests.html %}
          </div>
        </div>
        <div class="desktop-window activity-window">
          <div class="window-bar"><span>~/activity</span><span class="window-mark" aria-hidden="true">[x]</span></div>
          <div class="window-body">
            {% include audio.html %}
          </div>
        </div>
        <div class="desktop-window gaming-window">
          <div class="window-bar"><span>~/gaming</span><span class="window-mark" aria-hidden="true">[x]</span></div>
          <div class="window-body">
            {% include gaming.html %}
          </div>
        </div>
      </div>
      {% include links.html %}
    </div>
    {% include footer.html %}
  </main>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v=2.1" defer></script>
  <script src="{{ '/assets/js/audio.js' | relative_url }}?v=2.1.1" defer></script>
  <script src="{{ '/assets/js/guestbook.js' | relative_url }}?v=5" defer></script>
  <script src="{{ '/assets/js/gaming.js' | relative_url }}?v=2.3" defer></script>
</body>
</html>
