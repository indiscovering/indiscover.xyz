<form id="guestbook-form" autocomplete="off">
  <label for="guestbook-name">alias (optional)</label>
  <input id="guestbook-name" name="name" maxlength="32" placeholder="anonymous">
  <label for="guestbook-message">message</label>
  <textarea id="guestbook-message" name="message" maxlength="500" rows="4" required placeholder="say something..."></textarea>
  <div id="guestbook-count" class="guestbook-small">0 / 500</div>
  <div id="guestbook-turnstile"></div>
  <button id="guestbook-submit" type="submit" disabled>[ sign guestbook ]</button>
  <p id="guestbook-feedback" role="status"></p>
</form>
<div class="guestbook-heading">
  <h2 id="guestbook-entries-title">entries</h2>
  <button id="guestbook-refresh" type="button">[ refresh ]</button>
</div>
<div id="guestbook-entries" aria-labelledby="guestbook-entries-title">loading...</div>
