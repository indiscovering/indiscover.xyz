<dialog id="terminal-modal" aria-label="terminal">
  <div class="modal-content">
    <form method="dialog"><button class="close-btn" aria-label="Close">[x]</button></form>
    <h2>~/terminal</h2>
    <div id="terminal-output" role="log" aria-live="polite" aria-label="Terminal output"></div>
    <form id="terminal-form">
      <label for="terminal-input">guest@indiscover:~$</label>
      <input id="terminal-input" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200" enterkeyhint="go">
      <button type="submit" aria-label="Run command">↵</button>
    </form>
  </div>
</dialog>
