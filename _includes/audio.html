<section class="audio" aria-labelledby="audio-title">
  <div class="audio-heading">
    <h2 id="audio-title">audio / last played</h2>
    <a href="https://www.last.fm/user/horizoned">last.fm ↗</a>
  </div>
  <div class="audio-track">
    <span class="audio-note" aria-hidden="true">♫</span>
    <span id="audio-track">checking listening activity...</span>
  </div>
  <div id="audio-progress" hidden>
    <progress id="track-progress" value="0" max="1" aria-label="Playback progress"></progress>
    <div class="audio-times"><span id="elapsed"></span><span id="duration"></span></div>
  </div>
  <div class="audio-meta">
    <p id="audio-status" class="audio-status"></p>
    <a id="spotify-link" hidden href="https://open.spotify.com/">spotify ↗</a>
  </div>
  <noscript><p class="audio-status">enable javascript to see listening activity.</p></noscript>
</section>
