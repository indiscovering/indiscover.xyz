<header class="profile">
  <div class="identity">
    <img src="{{ page.avatar-url | relative_url }}" alt="" width="64" height="64">
    <div>
      <h1>{{ page.avatar-name }} <span id="discord-presence" role="img" aria-label="discord: checking status" title="discord: checking status" data-status="unavailable"></span></h1>
      <div class="bio">{{ content }}</div>
    </div>
  </div>
</header>
